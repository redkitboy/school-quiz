<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soru Cevap Oyunu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #DDDDDD;
            text-align: center;
            margin: 0;
            padding-top: 140px;
        }
        .question {
            font-size: 32px; /* Soru metni boyutu */
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px; /* Butonlar ve resim arasında boşluk */
        }
        .answer-button {
            background-color: #000080;
            color: white;
            border: none;
            padding: 15px 30px; /* Buton iç boşlukları */
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 20px; /* Buton metin boyutu */
        }
        .answer-button:hover {
            background-color: #002D80;
        }
        .game-over {
            color: red;
            font-size: 24px;
            margin-top: 20px;
        }
        .question-picture {
            margin-top: 20px;
            height: 300px; /* Resim yüksekliği */
            width: auto; /* Genişlikte kısıtlama yok */
        }
		.score {
            color: green; /* Yeşil renkli metin */
            font-size: 24px;
            margin-top: 10px;
        }
        
        
        @media (max-width: 900px) {
    .answer-button {
        padding: 10px 20px; /* Yükseklik ve genişlik azaltıldı */
        font-size: 16px; /* Yazı tipi boyutu küçültüldü */
    }

    .question {
        font-size: 24px; /* Soru metni boyutu da küçültüldü */
    }

    .question-picture {
        height: 200px; /* Resim yüksekliği küçültüldü */
    }
            
    #gameOverMessage{
        font-size: 16px;
    }
}

    </style>
</head>
<body>

    <div id="game">
        <div class="question" id="questionText"></div>
        <div class="button-container">
            <button class="answer-button" id="answer1" onclick="checkAnswer(0)"></button>
            <button class="answer-button" id="answer2" onclick="checkAnswer(1)"></button>
            <button class="answer-button" id="answer3" onclick="checkAnswer(2)"></button>
            <button class="answer-button" id="answer4" onclick="checkAnswer(3)"></button>
        </div>
        <img class="question-picture" id="questionImage" src="" alt="Soru Resmi" />
        <div class="score" id="scoreDisplay">0 puan</div> <!-- Puan metni eklendi -->
        <div id="gameOverMessage" class="game-over"></div>
    </div>

    <script>
        const questions = [
            {
                question: "Hangisi geçmiş zamanda geçmektedir?",
                correctAnswer: "went",
                options: ["went", "go", "goes", "going"],
                picUrl: "img/trns.png"
            },
            {
                question: "Hangisi geçmiş zamanda geçmektedir?",
               correctAnswer: "played",
                options: ["played", "play", "plays", "playing"],
                picUrl: "img/trns.png"
            },
            {
                question: "Hangisi geçmiş zamanda geçmektedir?",
               correctAnswer: "invented",
                options: ["invented", "invent", "invents", "inventing"],
                picUrl: "img/trns.png"
            },
            {
                question: "Okuldan sonra eve gitti.",
                correctAnswer: "He went home after school.",
                options: ["He went home after school.", "He ate the toast", "He drank the tea.", "He bought a pencil."],
                picUrl: "https://static.vecteezy.com/system/resources/previews/020/438/476/original/children-returning-home-from-school-vector.jpg"
            },
            {
                question: "Kitabı doksan yıl önce yazdı.",
                correctAnswer: "He wrote the book ninety years ago.",
                options: ["He wrote the book ninety years ago.", "He started the game yesterday.", "I graduated from university.", "I drank tea"],
                picUrl: "img/yusuf.png"
            },
            {
                question: "On gün önce",
                correctAnswer: "ten days ago",  
                options: ["ten days ago", "ten weeks ago", "two months ago", "yesterday"],
                picUrl: "img/trns.png"
            },
            {
                question: ' "Dün" kelimesinin karşılığı hangisidir?',
                correctAnswer: "yesterday",
                options: ["yesterday", "tomorrow", "last week", "ten days ago"],
                picUrl: "img/trns.png"
            },
            {
                question: "Geçmiş zamandaki yazılışları gösterilen bu kelimelerden hangisi düzensiz(kuralsız) fiildir?",
                correctAnswer: "wrote",
                options: ["wrote", "played", "finished", "prepared"],
                picUrl: "img/trns.png"
            },
            {
                question: "Geçmiş zamandaki yazılışları gösterilen bu kelimelerden hangisi düzensiz(kuralsız) fiildir?",
                correctAnswer: "ran",
                options: ["ran", "invented", "tried", "walked"],
                picUrl: "img/trns.png"
            },
            {
                question: "SAID fiilinin yalın hali hangisidir?",
                correctAnswer: "say",
                options: ["say", "try", "go", "invent"],
                picUrl: "img/trns.png"
            },
            {
                question: "thought fiilinin yalın hali hangisidir?",
                correctAnswer: "think",
                options: ["think", "try", "die", "understand"],
                picUrl: "https://cdn.langeek.co/photo/21228/original/?type=jpeg"
            },
            {
                question: "Jack ......... the homework.",
                correctAnswer: "finished",
                options: ["finished", "ran", "played", "bought"],
                picUrl: "https://c7.alamy.com/comp/2BF972H/happy-little-boy-with-his-homework-done-at-table-2BF972H.jpg"
            },
            {
                question: "Atatürk ........ a black car.",
                correctAnswer: "had",
                options: ["had", "understood", "finished", "graduated"],
                picUrl: "https://cdn.motor1.com/images/mgl/RGvXA/s4/ulu-onderin-mercedes-i.webp"
            }
        ];

        let currentQuestionIndex = -1;
const usedQuestions = [];
let score = 0; // Puan değişkeni
let wrongAttempts = 0; // Yanlış cevap sayısı

function loadQuestion() {
    if (usedQuestions.length === questions.length) {
        document.getElementById("questionText").textContent = `Tebrikler, oyunu tamamladınız! Skor: ${score} / ${questions.length}`;
        document.querySelector(".button-container").style.display = 'none';
        document.querySelector(".question-picture").style.display = 'none';
        document.getElementById("scoreDisplay").style.display = 'none';

		
        return;
    }

    let randomIndex;
    do {
        randomIndex = Math.floor(Math.random() * questions.length);
    } while (usedQuestions.includes(randomIndex));

    usedQuestions.push(randomIndex);
    currentQuestionIndex = randomIndex;

    const currentQuestion = questions[currentQuestionIndex];
    document.getElementById("questionText").textContent = currentQuestion.question;
    document.getElementById("questionImage").src = currentQuestion.picUrl; // Resmi güncelle

    const shuffledOptions = [...currentQuestion.options].sort(() => Math.random() - 0.5);
    for (let i = 0; i < 4; i++) {
        document.getElementById(`answer${i + 1}`).textContent = shuffledOptions[i];
    }
}

async function checkAnswer(selectedIndex) {
    const currentQuestion = questions[currentQuestionIndex];
    const selectedAnswer = document.getElementById(`answer${selectedIndex + 1}`).textContent;

    if (selectedAnswer === currentQuestion.correctAnswer) { // DOĞRU CEVAP DURUMUNDA
        score++; // Puanı artır
        document.getElementById("scoreDisplay").textContent = score+ '/' + questions.length + ' puan'; // Puan metnini güncelle
		document.getElementById("gameOverMessage").style.display = 'none';
        loadQuestion();  // Bir sonraki soruyu yükle
    } else { // YANLIŞ CEVAP DURUMUNDA
        wrongAttempts++; // Yanlış cevabı artır
        document.getElementById("gameOverMessage").textContent = `Yanlış cevap! Doğru cevap: ${currentQuestion.correctAnswer}. Bu son hakkın!`;
		document.getElementById("gameOverMessage").style.display = 'block';
        
        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        await wait(500); // 200 ms bekler

        loadQuestion(); // Yanlış cevapta bir sonraki soruya geç
        if (wrongAttempts >= 2) {
            document.getElementById("gameOverMessage").textContent = "Yanlış cevap sayınız 2 oldu! Oyun bitti.";
            document.querySelector(".button-container").style.display = 'none';
            document.querySelector(".question-picture").style.display = 'none';
            document.getElementById("questionText").style.display = 'none';
        }
    }
}

// İlk soruyu yükle
loadQuestion();

    </script>

</body>
</html>
